name: package

# Reusable packaging pipeline. Callable from CI (PR/main) and release (tag).
# This workflow MUST NEVER publish: it only builds, packs, smokes and
# aggregates tarballs. Publishing lives in release.yml.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Aggregated tarball artifact name"
        value: ${{ jobs.aggregate.outputs.artifact-name }}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-cli:
    name: build CLI tarball
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
          run_install: false
      - name: Setup Node
        # No cache here on purpose: release avoids cache; CI caching (if any)
        # lives only in ci.yml jobs, never in this shared pipeline.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node 820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
      - name: Setup Python
        # Adapters integration spawns `python -m uvicorn crucible_core.main:app`
        # with PYTHONPATH; Core deps must exist in this job (Python checks
        # is a separate job). No cache here on purpose, same as other jobs.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python 5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install core dev extra
        run: python -m pip install --upgrade pip && python -m pip install "./core[dev]"
      - name: Verify source metadata
        # Pre-build source check: pins the product version to the CLI package
        # and validates core/CLI/runtime metadata. Other-OS runtime manifests
        # do not exist yet, so they are not required here (only warned).
        shell: bash
        run: |
          CLI_VER="$(node -p "require('./packages/cli/package.json').version")"
          echo "CLI version: $CLI_VER"
          node scripts/verify-release.mjs --expected-version "$CLI_VER"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Node typecheck + tests (gate before packaging)
        # Explicit CI acceptance gate: root typecheck/test cover the CLI,
        # adapters, and dashboard workspaces before any build/pack step.
        run: |
          pnpm typecheck
          pnpm test
      - name: Build dashboard (CLI stages it)
        run: pnpm --filter @crucible/dashboard build
      - name: Build CLI (stages dashboard)
        run: pnpm --filter @crucible/cli build
      - name: Pack CLI tarball
        # pnpm pack (never npm pack): the CLI's optionalDependencies use the
        # workspace: protocol in source, which npm pack keeps verbatim in the
        # tarball while pnpm pack rewrites to the exact version (0.1.0).
        # --pack-destination resolves from the invocation cwd (repo root).
        run: |
          mkdir -p dist-cli
          pnpm --filter @crucible/cli pack --pack-destination ./dist-cli
          ls -la dist-cli
      - name: Upload CLI tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-tarball
          path: dist-cli/*.tgz
          if-no-files-found: error
          retention-days: 7

  python-checks:
    name: python checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        # No cache here on purpose: release avoids cache; CI caching (if any)
        # lives only in ci.yml jobs, never in this shared pipeline.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python 5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install core dev extra
        # PyInstaller stays pinned via the core[dev] extra.
        run: python -m pip install --upgrade pip && python -m pip install "./core[dev]"
      - name: Pytest core
        run: python -m pytest core/tests
      - name: Ruff lint core
        run: python -m ruff check core
      - name: Ruff format check core
        run: python -m ruff format --check core

  build-runtime:
    name: runtime ${{ matrix.target }}
    needs: [build-cli, python-checks]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            target: win32-x64
            pkg: packages/core-win32-x64
          - os: ubuntu-22.04
            target: linux-x64-gnu
            pkg: packages/core-linux-x64-gnu
          - os: macos-15-intel
            target: darwin-x64
            pkg: packages/core-darwin-x64
          - os: macos-15
            target: darwin-arm64
            pkg: packages/core-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pnpm/action-setup ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node 820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python 5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install workspace (CLI smoke needs resolvable deps)
        run: pnpm install --frozen-lockfile
      - name: Install core + PyInstaller (native only, no cross-compile)
        # PyInstaller is expected via core[dev]; install it explicitly too so
        # the step stays green if the extra is renamed.
        run: python -m pip install --upgrade pip && python -m pip install "./core[dev]" pyinstaller
      - name: Download CLI tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-tarball
          path: dist-cli
      - name: Build native runtime (must run on target OS)
        run: python core/packaging/build_runtime.py --output-package ${{ matrix.pkg }} --license LICENSE --target ${{ matrix.target }}
      - name: Verify runtime package
        # Strict per-target check: validates the built package manifest, the
        # generated runtime-manifest.json, and the real executable SHA on
        # disk. Only this target's manifest exists in this job's checkout, so
        # the aggregate --require-runtime-manifests check cannot run here.
        shell: bash
        run: |
          CLI_VER="$(node -p "require('./packages/cli/package.json').version")"
          node scripts/verify-release.mjs --runtime-package ${{ matrix.pkg }} --expected-version "$CLI_VER" --require-runtime-manifest
      - name: Pack runtime tarball
        shell: bash
        run: |
          mkdir -p ../../dist-runtime
          npm pack --pack-destination ../../dist-runtime --silent
          ls -la ../../dist-runtime
        working-directory: ${{ matrix.pkg }}
      - name: Smoke packed CLI + runtime
        # smoke-packed-install.mjs accepts --cli-tarball/--runtime-tarball;
        # args after the script name are forwarded to the script, so no extra
        # `--` separator (it would reach node as a literal "--" argv entry and
        # parseArgs would reject it). Workspace install above guarantees
        # dependency tarballs resolve for the offline fixture.
        shell: bash
        run: |
          CLI_TARBALL="$(ls dist-cli/*.tgz | head -n 1)"
          RUNTIME_TARBALL="$(ls dist-runtime/*.tgz | head -n 1)"
          echo "CLI: $CLI_TARBALL"
          echo "Runtime: $RUNTIME_TARBALL"
          pnpm --filter @crucible/cli test:packed --cli-tarball "../../$CLI_TARBALL" --runtime-tarball "../../$RUNTIME_TARBALL"
      - name: Upload runtime tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-${{ matrix.target }}
          path: dist-runtime/*.tgz
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: aggregate + verify
    needs: [build-cli, python-checks, build-runtime]
    runs-on: ubuntu-22.04
    outputs:
      artifact-name: ${{ steps.set-name.outputs.name }}
    steps:
      - name: Checkout (verify script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout 3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download CLI tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-tarball
          path: dist
      - name: Download runtime win32-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-win32-x64
          path: dist
      - name: Download runtime linux-x64-gnu
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-linux-x64-gnu
          path: dist
      - name: Download runtime darwin-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-darwin-x64
          path: dist
      - name: Download runtime darwin-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-darwin-arm64
          path: dist
      - name: Checksum + count (exactly 5 tgz)
        shell: bash
        run: |
          ls -la dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
          cat dist/SHA256SUMS
          COUNT="$(ls dist/*.tgz | wc -l | tr -d ' ')"
          echo "tgz count: $COUNT"
          test "$COUNT" -eq 5
      - name: Verify release bundle
        # Aggregate layout check: exactly the 5 expected tarballs for the CLI
        # product version plus a SHA256SUMS file matching recomputed hashes.
        # Tarball internals are not reinspected here; contents were validated
        # by the source check in build-cli and the per-target runtime checks.
        shell: bash
        run: |
          CLI_VER="$(node -p "require('./packages/cli/package.json').version")"
          node scripts/verify-release.mjs --tarball-dir dist --expected-version "$CLI_VER"
      - name: Set artifact name output
        id: set-name
        run: echo "name=release-tarballs" >> "$GITHUB_OUTPUT"
      - name: Upload aggregated tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-tarballs
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

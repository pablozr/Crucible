[project]
name = "crucible-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "platformdirs>=4,<5",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
crucible-core = "crucible_core.server:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
crucible_core = ["migrations/*.py", "migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/crucible_core/migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
